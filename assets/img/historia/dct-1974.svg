<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" role="img">
  <!-- La transformada discreta del coseno, 1974: un bloque de ocho por ocho pixeles se
     descompone en ocho ondas de coseno. Las primeras llevan la imagen; las ultimas
     salen casi en cero y se pueden tirar. De ahi sale el JPEG. -->
  <!-- El unico color literal es el de la tinta sobre el papel de las laminas, el
       de la variable hist-papel-tinta de historia.css, declarado una vez en la raiz de
       este propio SVG. Va ahi y no en cada elemento porque un archivo cargado con
       img no hereda ni el currentColor ni las variables CSS de la pagina que lo
       muestra: a partir de esa raiz, todo el dibujo se pinta con currentColor. El
       fondo no lleva ninguno: se ve a traves, y el papel lo aporta la lamina. -->
  <style>
    svg { color: #2a2317; }

    .pixel { fill: currentColor; }
    .marco { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .eje { fill: none; stroke: currentColor; stroke-width: .7; stroke-dasharray: 3 3; opacity: .35; }
    .onda { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
    .flecha { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; }
    .rotulo {
      fill: currentColor;
      font-family: Inter, "Segoe UI", sans-serif;
      font-size: 9.5px;
    }
    .rotulo--fuerte { font-weight: 700; }
  </style>

  <!-- El bloque: ocho por ocho pixeles, con su luz para que se vea que es un
       trozo de imagen y no una tabla. Los tonos no son una foto real: solo
       marcan que el bloque lleva la informacion repartida. -->
  <rect class="pixel" x="8" y="70" width="9" height="9" fill-opacity="0.08"/>
  <rect class="pixel" x="17" y="70" width="9" height="9" fill-opacity="0.08"/>
